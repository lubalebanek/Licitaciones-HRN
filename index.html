function downloadDetailTemplate(){

  ws['!cols']=headers.map(h=>({wch:Math.min(Math.max(String(h).length+3,18),44)}));
  ws['!rows']=[{hpt:42},...blankRows.map(()=>({hpt:22}))];
  ws['!freeze']={xSplit:0,ySplit:1};
  ws['!autofilter']={ref:'A1:Z21'};
  const headerStyle={
    fill:{patternType:'solid',fgColor:{rgb:'1F4E78'}},
    font:{name:'Aptos',sz:10,bold:true,color:{rgb:'FFFFFF'}},

  };

    border:{top:{style:'thin',color:{rgb:'D9E3F0'}},bottom:{style:'thin',color:{rgb:'D9E3F0'}},left:{style:'thin',color:{rgb:'D9E3F0'}},right:{style:'thin',color:{rgb:'D9E3F0'}}},
    alignment:{vertical:'center',wrapText:true},
    font:{name:'Aptos',sz:10,color:{rgb:'40536D'}}
  };
  for(let c=0;c<headers.length;c++){

    ws[addr].s=headerStyle;
    for(let r=1;r<=20;r++){
      const a=XLSX.utils.encode_cell({r,c});
      ws[a]=ws[a]||{v:'',t:'s'};
      ws[a].s=cellBorder;
      if(r%2===0)ws[a].s={...cellBorder,fill:{patternType:'solid',fgColor:{rgb:'F4F8FC'}}};
    }
  }
  const info=[
    ['FORMATO DE DETALLE DE LICITACIONES',''],
    ['Cómo utilizar este archivo',''],
    ['1. No modificar, eliminar ni cambiar el orden de las 26 columnas de la hoja “Detalle”.',''],
    ['2. Cada fila corresponde a un registro del detalle de una licitación.',''],
    ['3. El Ejecutivo debe cargar el detalle de una sola licitación y seleccionar esa licitación en la plataforma.',''],
    ['4. La Jefatura puede utilizar este mismo formato para cargar históricos de múltiples años y licitaciones.',''],
    ['5. Mantén el ID de licitación en todas las filas.',''],
    ['6. Las fechas pueden ingresarse como fechas normales de Excel.','']
  ];
  const wi=XLSX.utils.aoa_to_sheet(info);
  wi['!cols']=[{wch:105},{wch:4}];
  wi['!rows']=[{hpt:30},{hpt:24},...Array(6).fill({hpt:22})];
  wi['A1'].s={fill:{patternType:'solid',fgColor:{rgb:'1F4E78'}},font:{name:'Aptos Display',sz:16,bold:true,color:{rgb:'FFFFFF'}},alignment:{vertical:'center'}};
  wi['A2'].s={fill:{patternType:'solid',fgColor:{rgb:'DCEAF7'}},font:{name:'Aptos',sz:11,bold:true,color:{rgb:'1F4E78'}},alignment:{vertical:'center'}};
  for(let r=2;r<info.length;r++)wi['A'+(r+1)].s={font:{name:'Aptos',sz:10,color:{rgb:'40536D'}},alignment:{vertical:'center',wrapText:true}};
  wi['!merges']=[{s:{r:0,c:0},e:{r:0,c:1}},{s:{r:1,c:0},e:{r:1,c:1}},{s:{r:2,c:0},e:{r:2,c:1}},{s:{r:3,c:0},e:{r:3,c:1}},{s:{r:4,c:0},e:{r:4,c:1}},{s:{r:5,c:0},e:{r:5,c:1}},{s:{r:6,c:0},e:{r:6,c:1}},{s:{r:7,c:0},e:{r:7,c:1}}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Detalle");

}

function normalizeDetailHeader(value){
  return String(value??'').trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/\\s+/g,' ').toUpperCase();
}
function detailExcelDateToISO(value){
  if(value===null||value===undefined||value==='')return '';
  if(value instanceof Date&&!Number.isNaN(value.getTime()))return value.toISOString().slice(0,10);
  if(typeof value==='number'){
    const d=XLSX.SSF.parse_date_code(value);
    if(!d)throw new Error('Fecha Excel inválida: '+value);
    return String(d.y).padStart(4,'0')+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  const raw=String(value).trim();
  let m=raw.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);
  if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  if(/^\\d{4}-\\d{2}-\\d{2}$/.test(raw))return raw;
  throw new Error('Fecha inválida: "'+raw+'"');
}
function detailExcelNumber(value){
  if(value===null||value===undefined||value==='')return '';
  if(typeof value==='number'){
    if(!Number.isFinite(value))throw new Error('Número inválido: '+value);
    return String(value);
  }
  const raw=String(value).trim().replace(/\\s/g,'').replace(/\\$/g,'');
  if(!raw)return '';
  const normalized=raw.includes(',')&&raw.includes('.')?raw.replace(/\\./g,'').replace(',','.'):raw.replace(',','.');
  const n=Number(normalized);
  if(!Number.isFinite(n))throw new Error('Número inválido: "'+raw+'"');
  return String(n);
}
const BULK_DETAIL_HEADERS=[
  'AREA','ID','ENTE TECNICO','CONCEPTO','PROVEEDOR','TOTAL PROVEEDORES','RUT EMPRESA','PRESTADOR (SUBCONTRATADO)','RUT PRESTADOR','PRESTACIÓN','ESPECIALIDAD','CANTIDAD','VALOR DE LA PRESTACIÓN','TOTAL CONVENIO','NUMERO DE RESOLUCION ADJUDICACION','FECHA DE RESOLUCION DE ADJUDICACION (FECHA DE INICIO)','FECHA ADJ (PORTAL)','NUMERO RESOLUCIÓN CONVENIO','FECHA DE RESOLUCION DE CONVENIO','TÉRMINO','FECHA DE TERMINO (MAXIMA VIGENCIA CON RENOVACION)','PRORROGADA/RENOVADA HASTA (ACTUAL)','TIPO DE RENOVACIÓN','NUMERO DE MESES CONVENIO','SITUACION ACTUAL','EJECUTIVO ACTUAL'
];
async function parseBulkDetailExcel(file){
  if(!(file instanceof File)||!file.name)throw new Error('Selecciona el Excel histórico.');
  const ext=file.name.toLowerCase().split('.').pop();
  if(!['xlsx','xls'].includes(ext||''))throw new Error('El archivo debe ser .xlsx o .xls');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  if(!wb.SheetNames.length)throw new Error('El Excel no contiene hojas');
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});
  if(!matrix.length)throw new Error('El Excel está vacío');
  const headers=(matrix[0]||[]).map(normalizeDetailHeader);
  const expected=BULK_DETAIL_HEADERS.map(normalizeDetailHeader);
  if(headers.length!==expected.length)throw new Error('El archivo debe tener exactamente 26 columnas. Se encontraron '+headers.length+'.');
  const mismatches=[];
  expected.forEach((h,i)=>{if(headers[i]!==h)mismatches.push('Columna '+(i+1)+': se esperaba "'+BULK_DETAIL_HEADERS[i]+'" y se encontró "'+(headers[i]||'(vacía)')+'"');});
  if(mismatches.length)throw new Error('Formato de columnas incorrecto. '+mismatches.join(' | '));
  const rows=matrix.slice(1).filter(row=>row.some(v=>String(v??'').trim()!==''));
  if(!rows.length)throw new Error('El Excel no contiene registros');
  const text=v=>v===null||v===undefined?'':String(v).trim();
  const objects=rows.map(row=>{
    const get=i=>row[i]??'';
    return {
      area:text(get(0)),id_licitacion:text(get(1)),ente_tecnico:text(get(2)),concepto:text(get(3)),proveedor:text(get(4)),
      total_proveedores:detailExcelNumber(get(5)),rut_empresa:text(get(6)),prestador_subcontratado:text(get(7)),rut_prestador:text(get(8)),
      prestacion:text(get(9)),especialidad:text(get(10)),cantidad:detailExcelNumber(get(11)),valor_prestacion:detailExcelNumber(get(12)),
      total_convenio:detailExcelNumber(get(13)),resolucion_adjudicacion:text(get(14)),fecha_resolucion_adjudicacion:detailExcelDateToISO(get(15)),
      fecha_adjudicacion_portal:detailExcelDateToISO(get(16)),resolucion_convenio:text(get(17)),fecha_resolucion_convenio:detailExcelDateToISO(get(18)),
      termino:detailExcelDateToISO(get(19)),fecha_termino_maxima:detailExcelDateToISO(get(20)),prorrogada_renovada_hasta:detailExcelDateToISO(get(21)),
      tipo_renovacion:text(get(22)),numero_meses:detailExcelNumber(get(23)),situacion_actual:text(get(24)),ejecutivo_actual:text(get(25))
    };
  });
  const missing=objects.filter(r=>!r.id_licitacion).length;
  if(missing)throw new Error('Hay '+missing+' registro(s) sin ID de licitación. El histórico debe contener el ID en todas las filas.');
  return objects;
}

function alertItems(active){
  const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Santiago"}).format(new Date());
  const stages={
    "En proceso":[["publication_date","Publicación"],["responses_publication_date","Publicación de respuestas"],["tender_close_date","Cierre"],["award_date","Adjudicación"]],
    "Publicada":[["responses_publication_date","Publicación de respuestas"],["tender_close_date","Cierre"],["award_date","Adjudicación"]],
    "En evaluación de ofertas":[["tender_close_date","Cierre"],["award_date","Adjudicación"]],
    "Cerrada":[["award_date","Adjudicación"]],
    "Adjudicada":[],
    "Detalle enviado":[]
  };
  const out=[];
  active.forEach(t=>{
    (stages[t.status]||[]).forEach(([field,label])=>{
      const date=t[field]; if(!date)return;
      const diff=Math.round((new Date(date+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
      if(diff<0)out.push({level:"red",date,label,t,diff});
      else if(diff<=1)out.push({level:"orange",date,label,t,diff});
      else if(diff<=7)out.push({level:"yellow",date,label,t,diff});
    });
  });
  return out.sort((a,b)=>{const rank={red:0,orange:1,yellow:2};return rank[a.level]-rank[b.level]||a.date.localeCompare(b.date);});
}

function teamHtml(){
  if(!teamPeople.length)return '<div class="empty">No hay personas registradas en el equipo.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>PERSONA</th><th>PERFIL</th><th>CORREO</th><th>ESTADO</th><th>LICITACIONES ACTIVAS</th><th>ACCIONES</th></tr></thead><tbody>'+teamPeople.map(p=>{const mine=p.id===user.id,active=Boolean(p.active),assigned=assignments.filter(a=>a.executive_id===p.id).length;return '<tr><td>'+esc(p.full_name)+'</td><td>'+esc(p.role==="jefatura"?"Jefatura":"Ejecutivo")+'</td><td>'+esc(p.email||"Sin correo")+'</td><td><span class="pill '+(active?'s4':'s2')+'"><i></i>'+(active?'Activa':'Desactivada')+'</span></td><td>'+assigned+'</td><td>'+(mine?'<span class="muted">Tu cuenta</span>':'<button class="link team-action" data-action="'+(active?'deactivate':'activate')+'" data-user="'+esc(p.id)+'" data-name="'+esc(p.full_name)+'">'+(active?'Desactivar':'Activar')+'</button> <button class="link team-action" data-action="delete" data-user="'+esc(p.id)+'" data-name="'+esc(p.full_name)+'">Eliminar</button>')+'</td></tr>';}).join('')+'</tbody></table></div><p class="muted" style="margin-top:14px">Al desactivar, la persona no podrá ingresar. Eliminar está disponible solo para cuentas sin actividad, para proteger el historial.</p>';
}
async function manageTeamUser(action,id,name){
  const labels={activate:"activar",deactivate:"desactivar",delete:"eliminar"};
  if(!confirm('¿Deseas '+labels[action]+' la cuenta de '+name+'?'+(action==="delete"?' Esta acción es permanente.':'')))return;
  const {data,error}=await db.functions.invoke("manage-user",{body:{action,user_id:id}});
  if(error||data?.error){let detail=data?.error||error?.message||"No se pudo actualizar la cuenta.";try{const response=error?.context;if(response&&typeof response.clone==="function"){const payload=await response.clone().json();if(payload?.error)detail=payload.error;}}catch{}message(detail,true);return;}
  await load();message(data?.message||"Cuenta actualizada correctamente.");
}
function showPasswordForm(){
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="password-overlay"><form class="modal" id="password-form"><div class="modal-head"><div><h2>Cambiar contraseña</h2><p>Confirma tu contraseña actual y elige una nueva de al menos 6 caracteres.</p></div><button type="button" class="quiet" id="password-close">✕</button></div><label>Contraseña actual<input name="current_password" type="password" autocomplete="current-password" required></label><label>Nueva contraseña<input name="new_password" type="password" minlength="6" autocomplete="new-password" required></label><label>Repite la nueva contraseña<input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required></label><p id="password-error" class="err" style="display:none;color:#ae4740"></p><div class="actions"><button type="button" class="btn" id="password-cancel">Cancelar</button><button class="btn primary" id="password-save">Actualizar contraseña</button></div></form></div>');
  const close=()=>$("#password-overlay")?.remove();
  $("#password-close").onclick=$("#password-cancel").onclick=close;
  $("#password-form").onsubmit=async(e)=>{
    e.preventDefault();
    const form=new FormData(e.target),button=$("#password-save"),errorBox=$("#password-error");
    const current=String(form.get("current_password")||"");
    const next=String(form.get("new_password")||"");
    const confirm=String(form.get("confirm_password")||"");
    errorBox.style.display="none";
    if(next.length<6){errorBox.textContent="La nueva contraseña debe tener al menos 6 caracteres.";errorBox.style.display="block";return;}
    if(next!==confirm){errorBox.textContent="Las nuevas contraseñas no coinciden.";errorBox.style.display="block";return;}
    if(next===current){errorBox.textContent="La nueva contraseña debe ser distinta de la actual.";errorBox.style.display="block";return;}
    button.disabled=true;button.textContent="Actualizando…";
    const {error:loginError}=await db.auth.signInWithPassword({email:user.email,password:current});
    if(loginError){errorBox.textContent="La contraseña actual no es correcta.";errorBox.style.display="block";button.disabled=false;button.textContent="Actualizar contraseña";return;}
    const {error:updateError}=await db.auth.updateUser({password:next});
    if(updateError){errorBox.textContent="No se pudo actualizar la contraseña: "+updateError.message;errorBox.style.display="block";button.disabled=false;button.textContent="Actualizar contraseña";return;}
    close();message("Tu contraseña se actualizó correctamente.");
  };
}
function showTenderDetail(tenderId){
  const tender=tenders.find(t=>t.id===tenderId); if(!tender)return;
  const owner=ownerName(tenderId);
  const canEditObservation=manager()||assignments.some(a=>a.tender_id===tenderId&&a.executive_id===user.id);
  const dateRow=(label,value)=>'<div class="detail-field"><label>'+label+'</label><div class="detail-value">'+esc(value?fmtDate(value):'Sin fecha')+'</div></div>';
  const obs=String(tender.observations||'');
  const body='<div class="detail-grid">'
    +'<div class="detail-field"><label>ID licitación</label><div class="detail-value">'+esc(tender.external_id||'Sin ID anterior')+'</div></div>'
    +'<div class="detail-field"><label>Estado</label><div class="detail-value"><span class="pill detail-status '+stateClass(tender.status)+'"><i></i>'+esc(tender.status||'Sin estado')+'</span></div></div>'
    +'<div class="detail-field full"><label>Título</label><div class="detail-value">'+esc(tender.title||'Sin título')+'</div></div>'
    +'<div class="detail-field"><label>Área</label><div class="detail-value">'+esc(tender.area||'Sin área')+'</div></div>'
    +'<div class="detail-field"><label>Responsable</label><div class="detail-value">'+esc(owner)+'</div></div>'
    +dateRow('Fecha de derivación',tender.derivation_date)
    +dateRow('Fecha de publicación',tender.publication_date)
    +dateRow('Publicación de respuestas',tender.responses_publication_date)
    +dateRow('Fecha de cierre',tender.tender_close_date)
    +dateRow('Fecha de adjudicación',tender.award_date)
    +'<div class="detail-field full"><label>Asunto de correo</label><div class="detail-value">'+esc(tender.email_subject||'Sin asunto registrado')+'</div></div>'
    +'<div class="detail-field full"><label>Observaciones</label>'+(canEditObservation?'<textarea id="detail-observations" class="detail-observations" maxlength="3000" placeholder="Escribe observaciones, antecedentes o información relevante de la licitación…">'+esc(obs)+'</textarea>':'<div class="detail-value">'+esc(obs||'Sin observaciones registradas.')+'</div>')+'</div>'
    +'</div>';
  const actions=canEditObservation?'<button type="button" class="btn" id="detail-close">Cerrar</button><button type="button" class="btn primary" id="detail-save">Guardar observaciones</button>':'<button type="button" class="btn primary" id="detail-close">Cerrar</button>';
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="detail-overlay"><section class="modal detail-modal"><div class="modal-head"><div><h2>Detalle de licitación</h2><p>'+esc(tender.external_id||'Sin ID anterior')+' · '+esc(tender.title||'')+'</p></div><button type="button" class="quiet" id="detail-x">✕</button></div>'+body+'<div class="actions">'+actions+'</div></section></div>');
  const close=()=>$("#detail-overlay")?.remove();
  $("#detail-x").onclick=close; $("#detail-close").onclick=close;
  $("#detail-save")?.addEventListener("click",async()=>{
    const button=$("#detail-save"); button.disabled=true; button.textContent="Guardando…";
    const observations=String($("#detail-observations")?.value||"").trim()||null;
    const {error}=await db.from("tenders").update({observations,updated_at:new Date().toISOString()}).eq("id",tenderId);
    if(error){button.disabled=false;button.textContent="Guardar observaciones";message(error.message,true);return;}
    close(); await load(); message("Observaciones actualizadas correctamente.");
  });
}
function showTenderDates(tenderId){
  const tender=tenders.find(t=>t.id===tenderId);if(!tender||!canEditTenderDates(tenderId))return;
  const value=(v)=>v||"";
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="dates-overlay"><form class="modal" id="dates-form"><div class="modal-head"><div><h2>Fechas de licitación</h2><p>'+esc(tender.external_id||"Sin ID anterior")+' · '+esc(tender.title)+'</p></div><button type="button" class="quiet" id="dates-close">✕</button></div><div class="formgrid"><label>Fecha de publicación<input name="publication_date" type="date" value="'+esc(value(tender.publication_date))+'"></label><label>Publicación de respuestas<input name="responses_publication_date" type="date" value="'+esc(value(tender.responses_publication_date))+'"></label><label>Fecha de cierre<input name="tender_close_date" type="date" value="'+esc(value(tender.tender_close_date))+'"></label><label>Fecha de adjudicación<input name="award_date" type="date" value="'+esc(value(tender.award_date))+'"></label></div><div class="actions"><button type="button" class="btn" id="dates-cancel">Cancelar</button><button class="btn primary" id="dates-save">Guardar fechas</button></div></form></div>');
  const close=()=>$("#dates-overlay")?.remove();$("#dates-close").onclick=$("#dates-cancel").onclick=close;
  $("#dates-form").onsubmit=async(e)=>{e.preventDefault();const form=new FormData(e.target),button=$("#dates-save");button.disabled=true;button.textContent="Guardando…";const row={publication_date:form.get("publication_date")||null,responses_publication_date:form.get("responses_publication_date")||null,tender_close_date:form.get("tender_close_date")||null,award_date:form.get("award_date")||null,updated_at:new Date().toISOString()};const {error}=await db.from("tenders").update(row).eq("id",tenderId);if(error){message(error.message,true);close();return;}close();await load();message("Fechas actualizadas correctamente.");};
}
function showCreate(executiveMode=false){
  const areas=["General","Asistencia","Otras Asistenciales","CRASI","Base","Traumatología","Laboratorio","Dialisis","Equipos Médicos","Indefinido"];
  const areaOptions=areas.map(a=>'<option value="'+esc(a)+'">'+esc(a)+'</option>').join("");
  const title=executiveMode?"Registrar licitación":"Derivar licitación";
  const subtitle=executiveMode?"Registra una licitación propia. Tú quedarás como responsable y podrás completar las fechas después.":"Registra la derivación y asigna a la persona responsable.";
  const fields=executiveMode?
    '<label>ID licitación<input name="external_id" required maxlength="80" placeholder="Ej.: 1057509-xx-xxxx"></label><label>Título<input name="title" required maxlength="200"></label><label>Área<select name="area" required><option value="">Selecciona un área</option>'+areaOptions+'</select></label><label>Asunto de correo<textarea name="email_subject" maxlength="300" placeholder="Escribe el asunto de correo"></textarea></label>' :
    '<label>ID licitación anterior <span class="muted">(opcional)</span><input name="external_id" placeholder="Ej.: 1057509-xx-xxxx"></label><label>Título<input name="title" required></label><div class="formgrid"><label>Área<select name="area" required><option value="">Selecciona un área</option>'+areaOptions+'</select></label><label>Responsable<select name="executive_id"><option value="">Sin asignar</option>'+people.filter(p=>p.active&&p.role==="ejecutivo").map(p=>'<option value="'+esc(p.id)+'">'+esc(p.full_name)+'</option>').join("")+'</select></label></div><label>Fecha de derivación<input name="derivation_date" type="date" required></label><label>Asunto de correo<textarea name="email_subject" maxlength="300" placeholder="Escribe el asunto de correo"></textarea></label>';
  const buttonText=executiveMode?"Guardar licitación":"Guardar derivación";
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="overlay"><form class="modal" id="create"><div class="modal-head"><div><h2>'+title+'</h2><p>'+subtitle+'</p></div><button type="button" class="quiet" id="close">✕</button></div>'+fields+'<div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">'+buttonText+'</button></div></form></div>');
  $("#close").onclick=$("#cancel").onclick=()=>$("#overlay").remove();
  $("#create").onsubmit=async(e)=>{
    e.preventDefault();const form=new FormData(e.target),button=$("#save");button.disabled=true;button.textContent="Guardando…";
    const {data:{user:u}}=await db.auth.getUser();
    if(executiveMode){
      const {data:tenderId,error}=await db.rpc("create_own_tender",{
        p_external_id:String(form.get("external_id")||"").trim(),
        p_title:String(form.get("title")||"").trim(),
        p_area:String(form.get("area")||"").trim(),
        p_email_subject:String(form.get("email_subject")||"").trim()||null
      });
      if(error){message(error.message||"No se pudo crear la licitación.",true);button.disabled=false;button.textContent=buttonText;return;}
      $("#overlay")?.remove();activeTab="Mis licitaciones";await load();message("Licitación creada correctamente. Tú quedaste como responsable.");return;
    }
    const row={external_id:String(form.get("external_id")||"").trim()||null,title:String(form.get("title")||"").trim(),area:String(form.get("area")||"").trim(),derivation_date:form.get("derivation_date")||null,email_subject:String(form.get("email_subject")||"").trim()||null,created_by:u.id};
    const {data:t,error}=await db.from("tenders").insert(row).select("id").single();
    if(error){message(error.message,true);$("#overlay")?.remove();return;}
    const executive=String(form.get("executive_id")||"");
    if(executive){const {error:aerr}=await db.from("tender_assignments").insert({tender_id:t.id,executive_id:executive,assigned_by:u.id});if(aerr)message("Derivación guardada, pero falló la asignación: "+aerr.message,true);}
    $("#overlay")?.remove();await load();message("Derivación guardada correctamente.");
  };
}

function showUserForm(){
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="user-overlay"><form class="modal" id="user-form"><div class="modal-head"><div><h2>Crear usuario</h2><p>La cuenta se crea al guardar. Define una contraseña inicial y entrégasela a la persona por un canal seguro.</p></div><button type="button" class="quiet" id="user-close">✕</button></div><label>Nombre completo<input name="full_name" required maxlength="120"></label><label>Correo institucional<input name="email" type="email" required></label><label>Contraseña inicial<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Perfil<select name="role"><option value="ejecutivo">Ejecutivo de licitaciones</option><option value="jefatura">Jefatura de licitaciones</option></select></label><div class="actions"><button type="button" class="btn" id="user-cancel">Cancelar</button><button class="btn primary" id="user-save">Crear usuario</button></div></form></div>');
  $("#user-close").onclick=$("#user-cancel").onclick=()=>$("#user-overlay").remove();
  $("#user-form").onsubmit=async(e)=>{
    e.preventDefault(); const form=new FormData(e.target),button=$("#user-save");
    button.disabled=true; button.textContent="Creando cuenta…";
    const {data,error}=await db.functions.invoke("create-user",{body:{
      full_name:String(form.get("full_name")).trim(),
      email:String(form.get("email")).trim(),
      role:String(form.get("role")),
      password:String(form.get("password"))
    }});
    $("#user-overlay")?.remove();
    if(error){
      let detail=error.message||"Error desconocido";
      try{const response=error.context;if(response&&typeof response.clone==="function"){const payload=await response.clone().json();if(payload?.error)detail=payload.error;}}catch{}
      message("No se pudo crear el usuario: "+detail,true);return;
    }
    if(data?.error){message(data.error,true);return;}
    await load(); message("Usuario creado: "+data.email+". Entrégale sus credenciales por un canal seguro.");
  };
}
async function changeStatus(id,status){
const t=tenders.find(x=>x.id===id);if(!t)return;
const {error}=await db.from("tenders").update({status,updated_at:new Date().toISOString()}).eq("id",id);
if(error){message(error.message,true);return;}
const {error:herr}=await db.from("tender_status_history").insert({tender_id:id,from_status:t.status,to_status:status,changed_by:user.id});
if(herr)message("Se guardó el estado, pero no el historial: "+herr.message,true);
await load();
}
if(SUPABASE_URL.startsWith("https://")&&!SUPABASE_PUBLIC_KEY.includes("PEGA_AQUI")){db.auth.getSession().then(({data})=>data.session?load():gate());db.auth.onAuthStateChange((_event,session)=>{if(session)setTimeout(()=>load(),0);else gate();});}
else gate("Antes de usar la página, reemplaza las dos líneas de configuración por la URL del proyecto y la clave pública de Supabase.");
</script>
