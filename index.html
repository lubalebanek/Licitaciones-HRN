.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:15px}.panel{padding:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-head h2{font-size:13px;margin:0 0 4px}.panel-head p{font-size:10px;color:#929daf;margin:0}.link{border:0;background:transparent;color:var(--blue);font-size:10px;font-weight:650}.toolbar{display:flex;gap:8px;margin:13px 0 10px}.search{height:33px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:0 9px;color:#99a4b2;flex:1}.search input{border:0;outline:0;width:100%;font-size:10px}.filter{height:33px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 8px;color:#64748b;font-size:10px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;font-size:8px;letter-spacing:.6px;color:#9aa5b4;height:33px;border-bottom:1px solid #edf0f4}td{font-size:10px;color:#65758c;padding:10px 8px 10px 0;border-bottom:1px solid #f0f2f6}tr:last-child td{border-bottom:0}.id{display:block;color:#354862;font-size:10px;font-weight:650}.title{display:block;max-width:245px;overflow:hidden;text-overflow:ellipsis;color:#919daf;font-size:9px;margin-top:3px}.pill{position:relative;display:inline-flex;align-items:center;gap:5px;border:0;border-radius:15px;padding:5px 8px;font-size:9px;white-space:nowrap}.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}.pill select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}.s0{background:#eef2ff;color:#5573d5}.s1{background:#e9f5ff;color:#3181bd}.s2{background:#f1f3f6;color:#758195}.s3{background:#f5efff;color:#8c61cd}.s4{background:#e9f7ef;color:#389267}.s5{background:#eff1f4;color:#87909c}.person{display:flex;align-items:center;gap:6px}.muted{font-size:9px;color:#9aa5b3}.empty{padding:35px 12px;text-align:center;color:#8996a9;font-size:11px}.notice{border:1px solid #f1dfb4;background:#fff8e8;color:#8a641d;border-radius:7px;padding:10px 12px;margin:-7px 0 15px;font-size:11px}.notice.error{border-color:#f2d3d0;background:#fff1ef;color:#aa4640}

footer{border-top:1px solid var(--line);margin-top:17px;padding:13px 2px;color:#9aa4b2;font-size:9px}footer span:last-child{float:right}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(75px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);overflow:auto}.dayname,.day{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:72px;background:#fff}.dayname{text-align:center;min-height:auto;background:#fafbfc;color:#8995a7;font-size:9px;font-weight:700}.day.outside{background:#fafbfc;color:#bbc2cc}.daynum{font-size:10px;color:#66758b}.event{display:block;margin-top:5px;padding:4px 5px;border-radius:4px;background:#eef2ff;color:#4f67bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px}.monthbar{display:flex;align-items:center;gap:8px}.monthbar strong{min-width:130px;text-align:center;font-size:12px}.iconbtn{width:29px;height:29px;border:1px solid var(--line);background:#fff;border-radius:5px;color:#697a91}
.history-item{padding:12px 2px;border-bottom:1px solid #edf0f4;display:flex;gap:10px;align-items:flex-start}.history-dot{width:8px;height:8px;border-radius:50%;background:#5975df;margin:4px 2px;flex:none}.history-item b{font-size:10px}.history-item small{display:block;color:#8996a8;font-size:9px;margin-top:4px}
.overlay{position:fixed;inset:0;background:#14274477;z-index:5;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:11px;width:min(490px,100%);padding:21px;box-shadow:0 20px 80px #14274433}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:17px}.modal h2{font-size:15px;margin:0 0 4px}.modal p{font-size:10px;color:#8c98aa;margin:0}.modal label{display:block;font-size:10px;font-weight:650;color:#53647d;margin:12px 0}.modal input,.modal select{display:block;width:100%;height:36px;border:1px solid #dfe5ed;border-radius:6px;padding:0 9px;margin-top:5px;outline-color:var(--blue);background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 10%,#e9efff,transparent 40%),var(--bg)}.gatecard{width:min(410px,100%);background:#fff;border:1px solid var(--line);border-radius:13px;padding:30px;box-shadow:var(--shadow)}.gatecard .logo{margin-bottom:20px}.gatecard h1{font-size:22px;margin:0 0 7px}.gatecard p{font-size:12px;color:#8592a6;line-height:1.55}.gatecard label{display:block;font-size:10px;font-weight:650;color:#53647d;margin:14px 0}.gatecard input{display:block;width:100%;height:39px;border:1px solid #dfe5ed;border-radius:6px;padding:0 10px;margin-top:5px}.gatecard .btn{width:100%;margin-top:9px;height:39px}.gatecard .err{font-size:11px;color:#ae4740;background:#fff1ef;border-radius:5px;padding:8px;margin-top:10px}
@media(max-width:1120px){.grid{grid-template-columns:minmax(0,1fr)}.aside-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{gap:8px}.content{padding-left:23px;padding-right:23px}}
@media(max-width:720px){.sidebar{width:59px;padding:14px 7px}.brand{justify-content:center;padding:0 0 15px}.brand>div:nth-child(2),.org,.nav-label,.nav button span:not(.glyph),.account .who,.account .quiet{display:none}.nav button{justify-content:center;padding:0}.account{justify-content:center;padding:12px 0 0}.main{margin-left:59px}.top{padding:0 13px}.topright{gap:8px}.content{padding:20px 12px}.headline{align-items:flex-start;gap:13px;flex-direction:column}.headline h1{font-size:21px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.stat{padding:12px;min-height:94px}.aside-panels{display:flex;flex-direction:column}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.calendar{grid-template-columns:repeat(7,minmax(52px,1fr))}.day{padding:5px;min-height:58px}.event{font-size:7px;padding:3px}.foot-right{float:none;display:block;margin-top:5px}.topright .online{font-size:0}.topright .online i{width:8px;height:8px}}

<body>
<div id="root"><main class="gate"><section class="gatecard"><div class="logo">L</div><h1>Conectando…</h1><p>Preparando el espacio de licitaciones.</p></section></main></div>
<script>
/* Pega aquí los mismos valores que ya usaste en tu index anterior. Solo clave publishable/anon. */
const SUPABASE_URL = "https://znnjcijfowdxvvnoxuxa.supabase.co";
const SUPABASE_PUBLIC_KEY = "sb_publishable_w2mhM9nOXtXCLX3k5JxS3g_7EFEOpud";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const states = ["En proceso","Publicada","Cerrada","En evaluación de ofertas","Adjudicada","Proceso cerrado"];
const stateClass = (s) => "s"+Math.max(0,states.indexOf(s));
let user=null, profile=null, tenders=[], assignments=[], people=[], teamPeople=[], history=[], activeTab="Resumen", search="", stateFilter="Todas", month=new Date(), notice="", noticeError=false;
const fmtDate=(d)=>d?new Intl.DateTimeFormat("es-CL",{dateStyle:"medium",timeZone:"America/Santiago"}).format(new Date(d+"T12:00:00")):"Sin fecha";
const shortDate=(d)=>d?new Intl.DateTimeFormat("es-CL",{day:"2-digit",month:"short",timeZone:"America/Santiago"}).format(new Date(d+"T12:00:00")):"";
const initials=(n)=>String(n||"").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"—";
const manager=()=>profile?.role==="jefatura";
function message(text,isError=false){notice=text;noticeError=isError;render();}
function gate(text="Inicia sesión con la cuenta creada en Supabase Authentication.",error=""){
$("#root").innerHTML='<main class="gate"><form class="gatecard" id="login"><div class="logo">L</div><div class="eyebrow">HOSPITAL REGIONAL DE ÑUBLE</div><h1>Gestión de licitaciones</h1><p>'+esc(text)+'</p><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" id="loginbtn">Iniciar sesión</button>'+(error?'<p class="err">'+esc(error)+'</p>':'')+'</form></main>';
$("#login").onsubmit=async(e)=>{e.preventDefault();const b=$("#loginbtn");b.disabled=true;b.textContent="Ingresando…";const {error}=await db.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(error)gate("Revisa tu correo y contraseña.",error.message);};
}
async function load(){
const {data:{user:u},error:authError}=await db.auth.getUser();
if(authError||!u){user=null;profile=null;gate(authError?.message||undefined);return;}
user=u;
const {data:p,error:profileError}=await db.from("profiles").select("id,full_name,role,active").eq("id",u.id).maybeSingle();
if(profileError||!p||!p.active){user=null;profile=null;await db.auth.signOut();gate("Tu usuario no tiene un perfil activo en public.profiles.",profileError?.message||"Solicita a jefatura que revise tu perfil.");return;}
profile=p;
let res=await db.from("tenders").select("id,external_id,title,area,status,publication_date,questions_close_date,tender_close_date,updated_at").order("created_at",{ascending:false});
if(res.error){message(res.error.message,true);return;}
tenders=res.data||[];
if(tenders.length){
const ids=tenders.map(t=>t.id);
const [a,h]=await Promise.all([
db.from("tender_assignments").select("tender_id,executive_id,assigned_by,assigned_at").in("tender_id",ids).is("ended_at",null),
db.from("tender_status_history").select("tender_id,from_status,to_status,changed_at,note,changed_by").in("tender_id",ids).order("changed_at",{ascending:false}).limit(100)
]);
if(a.error){message(a.error.message,true);return;} assignments=a.data||[];
history=h.data||[];
}else{assignments=[];history=[];}
const {data:pp}=await db.from("profiles").select("id,full_name,role,active").eq("active",true).order("full_name");
people=pp||[];
teamPeople=[];
if(manager()){
  const {data:teamData,error:teamError}=await db.functions.invoke("manage-user",{body:{action:"list"}});
  if(teamError||teamData?.error){message("No se pudo cargar el equipo: "+(teamData?.error||teamError?.message||"Error desconocido"),true);return;}
  teamPeople=teamData?.users||[];
}
render();
}
function ownerName(tid){const a=assignments.find(x=>x.tender_id===tid);return a?(people.find(p=>p.id===a.executive_id)?.full_name||"Ejecutivo"):"Sin asignar";}
function visible(){
let out=tenders;
if(activeTab==="Licitaciones derivadas"&&!manager())out=out.filter(t=>{const a=assignments.find(x=>x.tender_id===t.id);return a&&a.executive_id===user.id&&a.assigned_by!==user.id;});
if(activeTab==="Mis licitaciones"&&!manager())out=out.filter(t=>assignments.some(a=>a.tender_id===t.id&&a.executive_id===user.id));
if(activeTab==="Detalles")out=out.filter(t=>t.status==="Adjudicada"||t.status==="Proceso cerrado");
if(activeTab==="Historial")out=out.filter(t=>t.status==="Proceso cerrado");
if(stateFilter!=="Todas")out=out.filter(t=>t.status===stateFilter);
const q=search.toLowerCase();return out.filter(t=>(t.external_id+t.title+(t.area||"")+ownerName(t.id)).toLowerCase().includes(q));
}
function deadlines(){const today=new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Santiago"}).format(new Date());return tenders.flatMap(t=>[
t.publication_date?{date:t.publication_date,label:"Publicación",t}:null,
t.questions_close_date?{date:t.questions_close_date,label:"Cierre de preguntas",t}:null,
t.tender_close_date?{date:t.tender_close_date,label:"Cierre de licitación",t}:null
]).filter(x=>x&&x.date>=today).sort((a,b)=>a.date.localeCompare(b.date));}
function statusPill(s,tid){return '<label class="pill '+stateClass(s)+'"><i></i>'+esc(s)+(tid?'<select data-status="'+esc(tid)+'" aria-label="Cambiar estado">'+states.map(x=>'<option '+(x===s?'selected':'')+'>'+esc(x)+'</option>').join("")+'</select>':'')+'</label>';}
function tableHtml(list){if(!list.length)return '<div class="empty">No hay licitaciones que mostrar con estos filtros.</div>';return '<div class="table-wrap"><table><thead><tr><th>ID / TÍTULO</th><th>ÁREA</th><th>ESTADO</th><th>RESPONSABLE</th><th>CIERRE</th></tr></thead><tbody>'+list.map(t=>'<tr><td><b class="id">'+esc(t.external_id)+'</b><span class="title">'+esc(t.title)+'</span></td><td>'+esc(t.area||"Sin área")+'</td><td>'+statusPill(t.status,t.id)+'</td><td><span class="person"><span class="avatar">'+initials(ownerName(t.id))+'</span>'+esc(ownerName(t.id))+'</span></td><td class="muted">'+fmtDate(t.tender_close_date)+'</td></tr>').join("")+'</tbody></table></div>';}
function calendarHtml(){const y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1),offset=(start.getDay()+6)%7,first=new Date(y,m,1-offset),arr=deadlines();let out='<div class="calendar">'+["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>'<div class="dayname">'+d+'</div>').join("");for(let i=0;i<42;i++){const d=new Date(first);d.setDate(first.getDate()+i);const iso=new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Santiago"}).format(d);const list=arr.filter(x=>x.date===iso);out+='<div class="day '+(d.getMonth()!==m?'outside':'')+'"><span class="daynum">'+d.getDate()+'</span>'+list.slice(0,2).map(x=>'<span class="event" title="'+esc(x.t.external_id+" · "+x.label)+'">'+esc(x.t.external_id.split("-").slice(1).join("-"))+' '+esc(x.label)+'</span>').join("")+(list.length>2?'<span class="event">+'+(list.length-2)+' más</span>':'')+'</div>';}return out+'</div>';}
function historyHtml(){if(!history.length)return '<div class="empty">Todavía no hay cambios de estado registrados.</div>';return '<div>'+history.map(h=>{const t=tenders.find(x=>x.id===h.tender_id);const actor=people.find(p=>p.id===h.changed_by)?.full_name||"Usuario";return '<div class="history-item"><i class="history-dot"></i><div><b>'+esc(t?.external_id||"Licitación")+' · '+esc(h.from_status||"Creada")+' → '+esc(h.to_status)+'</b><small>'+esc(t?.title||"")+' · '+esc(actor)+' · '+fmtDate(h.changed_at.slice(0,10))+(h.note?" · "+esc(h.note):"")+'</small></div></div>';}).join("")+'</div>';}
function render(){
if(!user||!profile){gate();return;}
const list=visible(),dates=deadlines(),active=tenders.filter(t=>t.status!=="Proceso cerrado"),closed=tenders.filter(t=>t.status==="Proceso cerrado");
const title=activeTab==="Resumen"?"Resumen":activeTab;
const nav=manager()?["Resumen","Derivación de licitaciones","Mis licitaciones","Calendario","Detalles"]:["Resumen","Licitaciones derivadas","Mis licitaciones","Calendario"];

pperCase()+'</div><h1>'+(activeTab==="Resumen"?"Panel de licitaciones":esc(title))+'</h1><p>Seguimiento de procesos de la unidad, según tus permisos.</p></div>'+(manager()&&activeTab==="Derivación de licitaciones"?'<button id="new" class="btn primary">＋ Nueva licitación</button>':'')+'</div>'+(notice?'<div class="notice '+(noticeError?'error':'')+'">'+esc(notice)+'</div>':'')+(activeTab==="Resumen"||activeTab==="Seguimiento"?'<div class="stats"><article class="stat"><label>Licitaciones activas <span class="symbol">▤</span></label><strong>'+active.length+'</strong><small>Accesibles con tu perfil</small></article><article class="stat"><label>En evaluación <span class="symbol">◷</span></label><strong>'+tenders.filter(t=>t.status==="En evaluación de ofertas").length+'</strong><small>Requieren seguimiento</small></article><article class="stat"><label>Próximos hitos <span class="symbol">▦</span></label><strong>'+dates.length+'</strong><small>Fechas futuras registradas</small></article><article class="stat"><label>Procesos cerrados <span class="symbol">✓</span></label><strong>'+closed.length+'</strong><small>En historial</small></article></div>':'')+'<div class="grid"><section class="panel"><div class="panel-head"><div><h2>'+(activeTab==="Calendario"?"Calendario de hitos":activeTab==="Detalles"?"Detalles de licitaciones":activeTab==="Historial"?"Historial de estados":activeTab==="Equipo"?"Equipo de licitaciones":"Licitaciones")+'</h2><p>Información sincronizada con Supabase</p></div><button class="link" id="refresh">Actualizar ↻</button></div>'+(activeTab==="Calendario"?'<div class="monthbar"><button class="iconbtn" id="prev">‹</button><strong>'+new Intl.DateTimeFormat("es-CL",{month:"long",year:"numeric"}).format(month)+'</strong><button class="iconbtn" id="next">›</button></div>'+calendarHtml():activeTab==="Historial"?historyHtml():activeTab==="Equipo"?teamHtml():(activeTab!=="Resumen"&&activeTab!=="Seguimiento"?'<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="Buscar por ID, título o área…" value="'+esc(search)+'"></div><select id="filter" class="filter"><option>Todas</option>'+states.map(s=>'<option '+(stateFilter===s?'selected':'')+'>'+esc(s)+'</option>').join("")+'</select></div>':'')+((activeTab==="Historial"||activeTab==="Equipo"||activeTab==="Calendario")?"":tableHtml(list)))+'<div class="panel-head" style="margin:14px 0 0;padding-top:10px;border-top:1px solid #edf0f4"><p>Mostrando '+list.length+' licitación(es)</p><span class="muted">RLS activo</span></div></section><aside class="aside-panels"><section class="panel"><div class="panel-head"><div><h2>Próximos hitos</h2><p>Fechas de publicación y cierre</p></div></div>'+(dates.slice(0,4).map(x=>'<div class="deadline"><span class="date"><b>'+new Date(x.date+"T12:00:00").getDate()+'</b><small>'+new Intl.DateTimeFormat("es-CL",{month:"short",timeZone:"America/Santiago"}).format(new Date(x.date+"T12:00:00")).toUpperCase()+'</small></span><span class="desc"><b>'+esc(x.label)+'</b><small>'+esc(x.t.external_id)+' · '+esc(x.t.area||"Sin área")+'</small></span></div>').join("")||'<div class="empty">No hay fechas futuras registradas.</div>')+'<button id="goto-calendar" class="link" style="width:100%;padding-top:13px">Ver calendario completo ›</button></section><section class="panel"><div class="panel-head"><div><h2>Estados</h2><p>Distribución de las licitaciones</p></div></div>'+states.map(s=>'<div class="state-line"><span class="pill '+stateClass(s)+'"><i></i>'+esc(s)+'</span><strong>'+tenders.filter(t=>t.status===s).length+'</strong></div>').join("")+'</section></aside></div><footer>Unidad de Licitaciones <span>·</span><span>Los accesos se controlan en Supabase</span></footer></div></section></div>';
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;notice="";render();});
if(activeTab==="Derivación de licitaciones"){$(".grid")?.remove();const footer=$("footer");if(footer)footer.style.display="none";}
const passwordButton=document.createElement("button");passwordButton.id="change-password";passwordButton.innerHTML='<span class="glyph">⚿</span><span>Cambiar contraseña</span>';$(".nav").append(passwordButton);passwordButton.onclick=showPasswordForm;
$("#logout").onclick=async()=>{await db.auth.signOut();};
$("#refresh")?.addEventListener("click",()=>load());
if(activeTab==="Equipo"&&manager()){
  const add=document.createElement("button"); add.id="add-user"; add.className="btn primary";
  add.textContent="＋ Crear usuario"; $("#refresh").before(add); add.onclick=showUserForm;
}
$("#goto-calendar").onclick=()=>{activeTab="Calendario";render();};
$("#prev")?.addEventListener("click",()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render();});
$("#next")?.addEventListener("click",()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render();});
$("#new")?.addEventListener("click",showCreate);
$("#search")?.addEventListener("input",e=>{search=e.target.value;const pos=e.target.selectionStart;render();$("#search").focus();$("#search").setSelectionRange(pos,pos);});
$("#filter")?.addEventListener("change",e=>{stateFilter=e.target.value;render();});
document.querySelectorAll("[data-status]").forEach(s=>s.addEventListener("change",()=>changeStatus(s.dataset.status,s.value)));
document.querySelectorAll(".team-action").forEach(b=>b.onclick=()=>manageTeamUser(b.dataset.action,b.dataset.user,b.dataset.name));
}
function teamHtml(){
  if(!teamPeople.length)return '<div class="empty">No hay personas registradas en el equipo.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>PERSONA</th><th>PERFIL</th><th>CORREO</th><th>ESTADO</th><th>LICITACIONES ACTIVAS</th><th>ACCIONES</th></tr></thead><tbody>'+teamPeople.map(p=>{const mine=p.id===user.id,active=Boolean(p.active),assigned=assignments.filter(a=>a.executive_id===p.id).length;return '<tr><td>'+esc(p.full_name)+'</td><td>'+esc(p.role==="jefatura"?"Jefatura":"Ejecutivo")+'</td><td>'+esc(p.email||"Sin correo")+'</td><td><span class="pill '+(active?'s4':'s2')+'"><i></i>'+(active?'Activa':'Desactivada')+'</span></td><td>'+assigned+'</td><td>'+(mine?'<span class="muted">Tu cuenta</span>':'<button class="link team-action" data-action="'+(active?'deactivate':'activate')+'" data-user="'+esc(p.id)+'" data-name="'+esc(p.full_name)+'">'+(active?'Desactivar':'Activar')+'</button> <button class="link team-action" data-action="delete" data-user="'+esc(p.id)+'" data-name="'+esc(p.full_name)+'">Eliminar</button>')+'</td></tr>';}).join('')+'</tbody></table></div><p class="muted" style="margin-top:14px">Al desactivar, la persona no podrá ingresar. Eliminar está disponible solo para cuentas sin actividad, para proteger el historial.</p>';
}
async function manageTeamUser(action,id,name){
  const labels={activate:"activar",deactivate:"desactivar",delete:"eliminar"};
  if(!confirm('¿Deseas '+labels[action]+' la cuenta de '+name+'?'+(action==="delete"?' Esta acción es permanente.':'')))return;
  const {data,error}=await db.functions.invoke("manage-user",{body:{action,user_id:id}});
  if(error||data?.error){let detail=data?.error||error?.message||"No se pudo actualizar la cuenta.";try{const response=error?.context;if(response&&typeof response.clone==="function"){const payload=await response.clone().json();if(payload?.error)detail=payload.error;}}catch{}message(detail,true);return;}
  await load();message(data?.message||"Cuenta actualizada correctamente.");
}
function showPasswordForm(){
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="password-overlay"><form class="modal" id="password-form"><div class="modal-head"><div><h2>Cambiar contraseña</h2><p>Confirma tu contraseña actual y elige una nueva de al menos 6 caracteres.</p></div><button type="button" class="quiet" id="password-close">✕</button></div><label>Contraseña actual<input name="current_password" type="password" autocomplete="current-password" required></label><label>Nueva contraseña<input name="new_password" type="password" minlength="6" autocomplete="new-password" required></label><label>Repite la nueva contraseña<input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required></label><p id="password-error" class="err" style="display:none;color:#ae4740"></p><div class="actions"><button type="button" class="btn" id="password-cancel">Cancelar</button><button class="btn primary" id="password-save">Actualizar contraseña</button></div></form></div>');
  const close=()=>$("#password-overlay")?.remove();
  $("#password-close").onclick=$("#password-cancel").onclick=close;
  $("#password-form").onsubmit=async(e)=>{
    e.preventDefault();
    const form=new FormData(e.target),button=$("#password-save"),errorBox=$("#password-error");
    const current=String(form.get("current_password")||"");
    const next=String(form.get("new_password")||"");
    const confirm=String(form.get("confirm_password")||"");
    errorBox.style.display="none";
    if(next.length<6){errorBox.textContent="La nueva contraseña debe tener al menos 6 caracteres.";errorBox.style.display="block";return;}
    if(next!==confirm){errorBox.textContent="Las nuevas contraseñas no coinciden.";errorBox.style.display="block";return;}
    if(next===current){errorBox.textContent="La nueva contraseña debe ser distinta de la actual.";errorBox.style.display="block";return;}
    button.disabled=true;button.textContent="Actualizando…";
    const {error:loginError}=await db.auth.signInWithPassword({email:user.email,password:current});
    if(loginError){errorBox.textContent="La contraseña actual no es correcta.";errorBox.style.display="block";button.disabled=false;button.textContent="Actualizar contraseña";return;}
    const {error:updateError}=await db.auth.updateUser({password:next});
    if(updateError){errorBox.textContent="No se pudo actualizar la contraseña: "+updateError.message;errorBox.style.display="block";button.disabled=false;button.textContent="Actualizar contraseña";return;}
    close();message("Tu contraseña se actualizó correctamente.");
  };
}
function showCreate(){
const options=people.filter(p=>p.active&&p.role==="ejecutivo").map(p=>'<option value="'+esc(p.id)+'">'+esc(p.full_name)+'</option>').join("");
$("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="overlay"><form class="modal" id="create"><div class="modal-head"><div><h2>Nueva licitación</h2><p>Los datos incompletos se pueden agregar después.</p></div><button type="button" class="quiet" id="close">✕</button></div><label>ID de licitación<input name="external_id" required pattern="1057509-.+" placeholder="1057509-xx-xxxx"></label><label>Título<input name="title" required></label><div class="formgrid"><label>Área<input name="area"></label><label>Responsable<select name="executive_id"><option value="">Sin asignar</option>'+options+'</select></label><label>Fecha de publicación<input name="publication_date" type="date"></label><label>Cierre de preguntas<input name="questions_close_date" type="date"></label><label>Cierre de licitación<input name="tender_close_date" type="date"></label></div><div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Guardar licitación</button></div></form></div>');
$("#close").onclick=$("#cancel").onclick=()=>$("#overlay").remove();
$("#create").onsubmit=async(e)=>{e.preventDefault();const form=new FormData(e.target),button=$("#save");button.disabled=true;button.textContent="Guardando…";
const {data:{user:u}}=await db.auth.getUser();
const row={external_id:String(form.get("external_id")).trim(),title:String(form.get("title")).trim(),area:String(form.get("area")||"").trim()||null,publication_date:form.get("publication_date")||null,questions_close_date:form.get("questions_close_date")||null,tender_close_date:form.get("tender_close_date")||null,created_by:u.id};
const {data:t,error}=await db.from("tenders").insert(row).select("id").single();if(error){message(error.message,true);$("#overlay")?.remove();return;}
const executive=String(form.get("executive_id")||"");
if(executive){const {error:aerr}=await db.from("tender_assignments").insert({tender_id:t.id,executive_id:executive,assigned_by:u.id});if(aerr)message("Licitación creada, pero falló la asignación: "+aerr.message,true);}
$("#overlay")?.remove();await load();};
}

function showUserForm(){
  $("#root").insertAdjacentHTML("beforeend",'<div class="overlay" id="user-overlay"><form class="modal" id="user-form"><div class="modal-head"><div><h2>Crear usuario</h2><p>La cuenta se crea al guardar. Define una contraseña inicial y entrégasela a la persona por un canal seguro.</p></div><button type="button" class="quiet" id="user-close">✕</button></div><label>Nombre completo<input name="full_name" required maxlength="120"></label><label>Correo institucional<input name="email" type="email" required></label><label>Contraseña inicial<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Perfil<select name="role"><option value="ejecutivo">Ejecutivo de licitaciones</option><option value="jefatura">Jefatura de licitaciones</option></select></label><div class="actions"><button type="button" class="btn" id="user-cancel">Cancelar</button><button class="btn primary" id="user-save">Crear usuario</button></div></form></div>');
  $("#user-close").onclick=$("#user-cancel").onclick=()=>$("#user-overlay").remove();
  $("#user-form").onsubmit=async(e)=>{
    e.preventDefault(); const form=new FormData(e.target),button=$("#user-save");
    button.disabled=true; button.textContent="Creando cuenta…";
    const {data,error}=await db.functions.invoke("create-user",{body:{
      full_name:String(form.get("full_name")).trim(),
      email:String(form.get("email")).trim(),
      role:String(form.get("role")),
      password:String(form.get("password"))
    }});
    $("#user-overlay")?.remove();
    if(error){
      let detail=error.message||"Error desconocido";
      try{const response=error.context;if(response&&typeof response.clone==="function"){const payload=await response.clone().json();if(payload?.error)detail=payload.error;}}catch{}
      message("No se pudo crear el usuario: "+detail,true);return;
    }
    if(data?.error){message(data.error,true);return;}
    await load(); message("Usuario creado: "+data.email+". Entrégale sus credenciales por un canal seguro.");
  };
}
async function changeStatus(id,status){
const t=tenders.find(x=>x.id===id);if(!t)return;
const {error}=await db.from("tenders").update({status,updated_at:new Date().toISOString()}).eq("id",id);
if(error){message(error.message,true);return;}
const {error:herr}=await db.from("tender_status_history").insert({tender_id:id,from_status:t.status,to_status:status,changed_by:user.id});
if(herr)message("Se guardó el estado, pero no el historial: "+herr.message,true);
await load();
}
if(SUPABASE_URL.startsWith("https://")&&!SUPABASE_PUBLIC_KEY.includes("PEGA_AQUI")){db.auth.getSession().then(({data})=>data.session?load():gate());db.auth.onAuthStateChange((_event,session)=>{if(session)setTimeout(()=>load(),0);else gate();});}
else gate("Antes de usar la página, reemplaza las dos líneas de configuración por la URL del proyecto y la clave pública de Supabase.");
</script>
